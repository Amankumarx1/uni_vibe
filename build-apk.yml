name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      # Installable debug APK that talks to your deployed site.
      # Change the URL if your server lives somewhere else (must end with /).
      - name: Build debug APK
        run: gradle assembleDebug -Punivibe.baseUrl=https://univibe-gilt.vercel.app/
      - uses: actions/upload-artifact@v4
        with:
          name: univibe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
